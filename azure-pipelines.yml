
trigger:
- master

pool:
  name: 'TLEX-Build'

variables:
  buildConfiguration: 'Release'
  NUGET_PACKAGES: 'R:\NuGet\packages'
  DOTNET_CLI_HOME: 'R:\dotnet-cli'

steps:
- checkout: self
  clean: true

- powershell: |
    dotnet --info
    dotnet --list-sdks
  displayName: 'Verify .NET 10 SDK'

- powershell: |
    dotnet restore AneedWeb.sln
    if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
  displayName: 'Restore NuGet packages'

- powershell: |
    dotnet build AneedWeb.sln --configuration $(buildConfiguration) --no-restore
    if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
  displayName: 'Build .NET 10 solution'

- powershell: |
    dotnet publish AneedWeb.csproj --configuration $(buildConfiguration) --no-restore --output "$(Build.ArtifactStagingDirectory)\publish"
    if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
  displayName: 'Publish Blazor website'

- task: PublishPipelineArtifact@1
  displayName: 'Save website artifact'
  inputs:
    targetPath: '$(Build.ArtifactStagingDirectory)\publish'
    artifact: 'AneedWeb'
    publishLocation: 'pipeline'

